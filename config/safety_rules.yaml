# Safety-Rule Layer.
# A rule may only keep or raise urgency. A lower level number is more urgent.
# clinically_reviewed stays false until a clinician reviews the threshold.
# Field comparisons run only when that field's validation status is ok,
# so a mistyped value (BP 0, temp 96, SpO2 150) cannot force a level by itself.
# `example` is the unit-test intake that must fire this rule. It is not a case history.

rules:
  - id: spo2_below_90
    description: SpO2 under 90 percent
    condition:
      field: spo2
      op: lt
      value: 90
      require_status: ok
    min_level: 1
    reason: "SpO2 is below 90. Placeholder threshold, not clinically reviewed."
    clinically_reviewed: false
    example:
      age: 54
      sex: female
      systolic_bp: 118
      diastolic_bp: 76
      pulse: 88
      temperature_c: 36.8
      spo2: 85
      complaint: "feels unwell"

  - id: spo2_below_94
    description: SpO2 under 94 percent
    condition:
      field: spo2
      op: lt
      value: 94
      require_status: ok
    min_level: 2
    reason: "SpO2 is below 94. Placeholder threshold, not clinically reviewed."
    clinically_reviewed: false
    example:
      age: 54
      sex: male
      systolic_bp: 122
      diastolic_bp: 78
      pulse: 84
      temperature_c: 36.9
      spo2: 92
      complaint: "mild cough"

  - id: shock_low_sbp_high_pulse
    description: Low systolic pressure with a fast pulse
    condition:
      all:
        - field: systolic_bp
          op: lt
          value: 90
          require_status: ok
        - field: pulse
          op: gt
          value: 110
          require_status: ok
    min_level: 1
    reason: "Systolic pressure is under 90 with pulse over 110. Placeholder, not clinically reviewed."
    clinically_reviewed: false
    example:
      age: 61
      sex: male
      systolic_bp: 82
      diastolic_bp: 54
      pulse: 124
      temperature_c: 36.6
      spo2: 96
      complaint: "dizzy"

  - id: pulse_above_130
    description: Pulse over 130
    condition:
      field: pulse
      op: gt
      value: 130
      require_status: ok
    min_level: 1
