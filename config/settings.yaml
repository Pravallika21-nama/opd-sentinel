# Non-clinical project settings.
# Clinical thresholds live in safety_rules.yaml and validation_ranges.yaml.
# Every clinical threshold is a placeholder until a clinician reviews it.

project_name: OPD Sentinel
random_seed: 42

splits:
  train: 0.70
  val: 0.15
  test: 0.15

data:
  # Official intake file. Git-ignored. Headers are unknown until the organiser
  # file is added — do not guess them. null means "this file already uses the
  # logical field name". Replace nulls with real headers when the file arrives.
  official_path: data/raw/intake.csv
  synthetic_path: data/synthetic/intake_synthetic.csv
  arrivals_synthetic_path: data/synthetic/arrivals_synthetic.csv
  processed_dir: data/processed
  # Public, de-identified KTAS dataset (Moon et al., PLOS ONE 2019, CC BY 4.0).
  # Emergency-department data, not OPD data. See DATASET.md for the mapping.
  # The workbook is downloaded by `make ktas` into the git-ignored data/raw folder.
  ktas:
    url: https://journals.plos.org/plosone/article/file?type=supplementary&id=10.1371/journal.pone.0216972.s001
    workbook_path: data/raw/ktas/pone.0216972.s001.xlsx
    sha256: f631c951178799179d0fbd74fe979464b955ea1b426222bf015b163b8a24beb0
    intake_path: data/raw/ktas/ktas_intake.csv
    guideline_url: https://journals.plos.org/plosone/article/file?type=supplementary&id=10.1371/journal.pone.0216972.s002
  # MIMIC-IV-ED Demo v2.2 (100 patients, Open Data Commons ODbL v1.0, open access).
  # Used only as an external test set and for the insights page. Never for training.
  # SHA-256 values are the ones PhysioNet publishes in SHA256SUMS.txt.
  mimic_demo:
    dir: data/raw/mimic_ed_demo
    intake_path: data/raw/mimic_ed_demo/mimic_demo_intake.csv
    files:
      triage:
        url: https://physionet.org/files/mimic-iv-ed-demo/2.2/ed/triage.csv.gz
        sha256: 086dadcb49adc5f24bdda0e342ec9cf0fbcb2e9595516c5c101d408434e1e09b
      edstays:
        url: https://physionet.org/files/mimic-iv-ed-demo/2.2/ed/edstays.csv.gz
        sha256: fc185cb111a70e9dfd8457c6e1da4f9366dee729e072282995dcd7045a5a3c52
      diagnosis:
        url: https://physionet.org/files/mimic-iv-ed-demo/2.2/ed/diagnosis.csv.gz
        sha256: 3a2d6bfb402d5783f1950f4729dd378e825475719f0535fb6b0209c2bc0744e9
      patients:
        url: https://physionet.org/files/mimic-iv-demo/2.2/hosp/patients.csv.gz
        sha256: 59dcc6cd8450ddf03ad32cc7d76e41caa4c9633541715987f590c74835cf6fae
  column_map:
    case_id: null
    age: null
    sex: null
    systolic_bp: null
    diastolic_bp: null
    pulse: null
    temperature_c: null
    spo2: null
    complaint: null
    known_conditions: null
    medications: null
    record_source: null
    # Hidden labels. Never pass these into the feature matrix.
    triage_level: null
    department: null
    emergency: null

synthetic:
  rows: 2400
  emergency_rate: 0.04
  seed: 42

abstention:
  # Placeholder. Not clinically reviewed.
  clinically_reviewed: false
  # Uncertainty is 0 at probability 0 or 1, and 1 at probability 0.5.
  max_uncertainty: 0.85
  message: "Cannot assess, send to nurse now"

classical:
  emergency_class_weight: 20
  tfidf_max_features: 600
  tfidf_ngram_min: 2
  tfidf_ngram_max: 4

evaluation:
  # Local proxy used only when an official evaluate.py is absent.
  kind: proxy
  undertriage_emergency_weight: 20
  overtriage_weight: 1
  emergency_levels: [1, 2]
  bootstrap_samples: 200
  official_candidates:
    - evaluate.py
    - official/evaluate.py

queue_sim:
  # Assumptions for the stretch simulation. Not a measurement of a real clinic.
  n_servers: 2
  service_minutes: 6
  arrivals: 800

artifacts:
  classical: backend/ml/artifacts/classical.joblib
  classical_meta: backend/ml/artifacts/classical_meta.json

reports:
  json: reports/results.json
  markdown: reports/results.md
  figures: reports/figures
