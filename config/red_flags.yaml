# Red-flag lexicon. A match is not a diagnosis.
# Languages: English, Hindi (roman and Devanagari), Telugu (roman and script),
# and a small Tamil set. This is not a general translator.
# Negation: English tokens are checked before the phrase ("no chest pain").
# Hindi/Telugu tokens are checked after the phrase ("dard nahi", "noppi ledu").
# "nahi" inside a listed symptom phrase such as "saans nahi" is not a negation.

negation:
  before:
    # Quoted: unquoted `no` is a YAML boolean and would be stored as false.
    - "no"
    - "not"
    - without
    - denies
    - denied
    - never
  after:
    - nahi
    - nahin
    - nhi
    - ledu
    - ledhu
    - kadu
    - नहीं
    - లేదు

