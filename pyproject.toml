[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opd-sentinel"
version = "0.1.0"
description = "Safety-first triage decision support for an overloaded hospital outpatient department."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Installed by `make setup`. Presence of these libraries is not a measured result.
# openpyxl reads the published KTAS supplementary workbook.
ml = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "openpyxl==3.1.5",
]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "hypothesis==6.142.1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend/app", "backend/core", "backend/tests"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ml.*", "eval.*"]
follow_imports = "skip"
ignore_errors = true
